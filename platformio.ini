; Desktop gadget — LilyGO T4-S3 Fliqlo flip clock
;
; The [env] block below is copied from the LilyGo-AMOLED-Series
; platformio.ini. Every flag is load-bearing — see
; docs/decisions/D003 - Copy the library platformio env verbatim.md
; Do not "tidy" it.

[platformio]
default_envs = t4s3
boards_dir = boards

; Build tree is deliberately OUTSIDE iCloud Drive.
; See docs/decisions/D006 - Keep build artifacts out of iCloud.md
build_dir = /Users/acko/.pio-builds/desktop-gadget

[env]
platform = espressif32@6.12.0
framework = arduino
board = T-Display-AMOLED
upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

monitor_filters =
    default
    esp32_exception_decoder

; The LilyGO support library is consumed from a local clone rather than
; re-downloaded per project — the repo is 400 MB, mostly datasheets.
lib_extra_dirs =
    /Users/acko/.local/src

lib_deps =
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ ^6.21.5
    ; NimBLE rather than Bluedroid: ~1/3 the flash and RAM for a peripheral
    ; role. Pinned to 1.x — NimBLE-Arduino 2.x requires ESP32 core 3.x and
    ; we are on 2.0.17 via espressif32@6.12.0.
    h2zero/NimBLE-Arduino @ ^1.4.2
    esphome/ESPAsyncWebServer-esphome @ ^3.2.2
    lewisxhe/XPowersLib @ 0.2.7
    lewisxhe/SensorLib @ 0.2.4
    bxparks/AceButton @ 1.10.1
    mikalhart/TinyGPSPlus @ 1.0.3
    adafruit/Adafruit NeoPixel @ 1.11.0
    bodmer/TFT_eSPI @ 2.5.31
    FS
    SPIFFS
    SD

[env:t4s3]
extends = env
